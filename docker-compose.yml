# =============================================================================
# Docker Compose - Janus IDP (Identity Provider)
# =============================================================================
# Este compose faz parte do ecossistema UX Auditor e utiliza uma rede externa
# para comunicação entre microsserviços.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Serviço de Banco de Dados PostgreSQL
  # ---------------------------------------------------------------------------
  janus-db:
    image: postgres:15-alpine
    container_name: janus-db
    restart: always
    # Utiliza arquivo .env para todas as variáveis de ambiente
    env_file:
      - .env
    ports:
      - "5432:${POSTGRES_PORT:-5432}"
    # Verificação de saúde do container PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      # Volume nomeado para persistência dos dados do banco
      - janus-postgres-data:/var/lib/postgresql/data
    # Conecta à rede externa do ecossistema UX Auditor
    networks:
      - ux-auditor-network

  # ---------------------------------------------------------------------------
  # Serviço da Aplicação Janus IDP
  # ---------------------------------------------------------------------------
  janus-service:
    # Build do diretório atual com Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    container_name: janus-service
    restart: always
    # Utiliza arquivo .env para todas as variáveis de ambiente
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      janus-db:
        condition: service_healthy
    volumes:
      # Volume nomeado para persistir chaves RSA entre reinicializações
      - janus-rsa-keys:/app/keys
    # Conecta à rede externa do ecossistema UX Auditor
    networks:
      - ux-auditor-network
    # Verificação de saúde da aplicação
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

# =============================================================================
# Redes
# =============================================================================
# Rede externa gerenciada pelo ecossistema UX Auditor
# Esta rede deve ser criada previamente com: docker network create ux-auditor-network
networks:
  ux-auditor-network:
    external: true

# =============================================================================
# Volumes
# =============================================================================
# Volumes nomeados para persistência de dados
volumes:
  janus-postgres-data:
  janus-rsa-keys:
