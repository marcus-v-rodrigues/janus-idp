version: '3.8'

services:
  janus-db:
    image: postgres:15-alpine
    container_name: janus_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-idp_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - janus_network

  janus-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: janus_service
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-idp_admin}:${POSTGRES_PASSWORD}@janus-db:5432/${POSTGRES_DB:-idp_db}?schema=public
      ISSUER_URL: ${ISSUER_URL:-http://localhost:3000/oidc}
      UX_CLIENT_ID: ${UX_CLIENT_ID:-ux-auditor}
      UX_CLIENT_SECRET: ${UX_CLIENT_SECRET}
      UX_BASE_DOMAIN: ${UX_BASE_DOMAIN:-dashboard.seudominio.com}
      COOKIE_KEYS: ${COOKIE_KEYS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
    env_file:
      - .env
    depends_on:
      janus-db:
        condition: service_healthy
    networks:
      - janus_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  janus_network:
    driver: bridge

volumes:
  postgres_data:
